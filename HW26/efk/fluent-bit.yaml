service:                      # настройки самой программы
  flush: 1                    # отправлять накопленное каждую секунду
  log_level: info             # уровень собственных логов fluent bit
pipeline:                     # путь логов: вход, выход
  inputs:                     # откуда брать логи
    - name: forward           # принимать логи по сети. 
      listen: 0.0.0.0         # слушать на всех интерфейсах контейнера
      port: 24224             # порт приёма

  outputs:                    # куда отправлять логи
    - name: es                # отправка в elasticsearch
      match: "*"              # брать записи с любым тегом
      host: elasticsearch     # имя сервиса с базой (опишем в compose на следующем шаге)
      port: 9200              # порт базы
      index: node-app         # название индекса, куда лягут логи
      suppress_type_name: On  # не отправлять поле type
    - name: stdout            # ещё и печатать записи в терминал
      match: "*"              # брать записи с любым тегом