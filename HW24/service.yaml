apiVersion: v1
kind: Service

metadata:
  name: hw24-service

spec:
  
  type: NodePort           # чтобы доступ был с хоста
  
  selector:
    app: hw24-python       # связь с подами по этому лейблу
  
  ports:
  - port: 80               # порт самого сервиса
    targetPort: 8082       # перенаправляет на этот порт контейнера
    nodePort: 30080        # порт на хосте (допустимый диапазон 30000-32767)